<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WildWatch – Wildlife Monitoring & Community Safety</title>
    <meta name="description" content="WildWatch – Real-time wildlife monitoring and community safety platform for reporting sightings, tracking zones, and receiving alerts.">
    <meta name="theme-color" content="#1b4d3e">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231b4d3e'/%3E%3Ctext y='.9em' font-size='68' x='12' fill='white'%3E🐾%3C/text%3E%3C/svg%3E">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=3">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="app">
        <!-- Navigation Bar -->
        <nav class="navbar" id="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <i class="fas fa-paw"></i>
                    <h1>WildWatch</h1>
                </div>
                <div class="nav-links" id="navLinks">
                    <!-- Dynamic links will be inserted here -->
                </div>
                <div class="nav-user" id="navUser">
                    <!-- User info will be inserted here -->
                </div>
                <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content Container -->
        <main id="mainContent"></main>

        <!-- Site Footer -->
        <footer id="siteFooter" class="site-footer" style="display:none;">
            <div class="footer-inner">
                <div class="footer-brand">
                    <i class="fas fa-paw"></i>
                    <div>
                        <strong>WildWatch</strong>
                        <p>Forest Department of India</p>
                    </div>
                </div>
                <div class="footer-links">
                    <a href="#">About</a>
                    <a href="#">Contact</a>
                    <a href="#">Guidelines</a>
                    <a href="#">Privacy</a>
                </div>
            </div>
        </footer>

        <!-- Toast Notification Container -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- Scripts: load once at end of body (cache must load before main.js) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/cache.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/citizen.js?v=3"></script>
    <script src="js/officer.js?v=2"></script>
    <script src="js/admin.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
</body>

</html>
