<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WildWatch - Wildlife Spotting & Risk Monitoring System</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="app">
        <!-- Navigation Bar -->
        <nav class="navbar" id="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <i class="fas fa-paw"></i>
                    <h1>WildWatch</h1>
                </div>
                <div class="nav-links" id="navLinks">
                    <!-- Dynamic links will be inserted here -->
                </div>
                <div class="nav-user" id="navUser">
                    <!-- User info will be inserted here -->
                </div>
                <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content Container -->
        <main id="mainContent"></main>

        <!-- Toast Notification Container -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- Scripts: load once at end of body (cache must load before main.js) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/citizen.js"></script>
    <script src="js/officer.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
